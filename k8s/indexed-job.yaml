apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validator

spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: shard-validator

    spec:
      restartPolicy: Never

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: shard-validator

      containers:
        - name: validator
          image: spam-shard-validator:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: JOB_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "1"